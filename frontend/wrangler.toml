name = "procureops"
compatibility_date = "2026-06-01"

# workers_dev stays enabled so the original workers.dev URL (already
# referenced in README/portfolio links elsewhere) keeps working alongside
# the custom domain below.
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Custom domain — wrangler provisions the DNS record + SSL cert automatically
# on deploy since krishnaparuchuri.com is on the same Cloudflare account.
[[routes]]
pattern = "procureops.krishnaparuchuri.com"
custom_domain = true
